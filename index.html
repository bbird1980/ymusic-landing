<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Яндекс.Музыка — управление плеером</title>
<meta name="description" content="Расширение Chrome для управления плеером Яндекс Музыки с панели браузера: обложка, перемотка, лайк, громкость, горячие клавиши, метка ИИ-музыки и скробблинг в Last.fm.">
<link rel="icon" type="image/png" href="assets/icon-128.png">
<meta property="og:title" content="Яндекс.Музыка — управление плеером">
<meta property="og:description" content="Плеер Яндекс Музыки на панели браузера: обложка, перемотка, лайк, громкость, горячие клавиши, метка ИИ-музыки и скробблинг в Last.fm.">
<meta property="og:image" content="assets/screenshots/screenshot-1-music.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ee;
    --ink:#211c14;
    --muted:#6b6151;
    --line:#ddd3ba;
    --spark:#c98600;
    --spark-ink:#141210;
    --spark-glow:rgba(201,134,0,.22);
    --stage:#0c0a08;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141210;
      --ink:#f4eee0;
      --muted:#a89d88;
      --line:#332c22;
      --spark:#f5df00;
      --spark-ink:#1a1710;
      --spark-glow:rgba(245,223,0,.2);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141210;
    --ink:#f4eee0;
    --muted:#a89d88;
    --line:#332c22;
    --spark:#f5df00;
    --spark-ink:#1a1710;
    --spark-glow:rgba(245,223,0,.2);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',system-ui,'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}

  /* ---------- header ---------- */
  header.site{
    flex:none;
    min-height:60px;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    padding:10px 22px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:1 1 auto;}
  .brand svg{width:22px;height:22px;color:var(--spark);flex:none;}
  .brand span{
    font-family:'Unbounded','Manrope',system-ui,sans-serif;
    font-weight:700;font-size:15px;letter-spacing:.005em;
    line-height:1.25;
  }
  .btn-install{
    flex:none;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--spark);color:var(--spark-ink);
    padding:10px 18px;border-radius:99px;
    font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;
    text-decoration:none;
    box-shadow:0 8px 22px -10px var(--spark-glow);
  }
  .btn-install svg{width:16px;height:16px;}
  @media (max-width:440px){
    header.site{padding:8px 12px;gap:10px;}
    .brand svg{width:18px;height:18px;}
    .brand span{font-size:12.5px;}
    .btn-install{padding:8px 13px;font-size:12.5px;gap:6px;}
    .btn-install svg{width:14px;height:14px;}
  }

  /* ---------- stage / carousel ---------- */
  .stage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    overflow:hidden;
    touch-action:pan-y;
  }
  .frame{
    position:relative;
    width:100%;height:100%;
    max-width:1280px;
    max-height:800px;
    border-radius:18px;
    overflow:hidden;
    background:var(--stage);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.45);
  }
  .slides{
    position:relative;
    width:100%;height:100%;
  }
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity .55s ease;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto;}
  .slide img{
    width:100%;height:100%;
    object-fit:contain;
  }

  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(20,17,13,.5);
    backdrop-filter:blur(6px);
    color:#f4eee0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
    z-index:4;
  }
  .arrow:hover{background:rgba(20,17,13,.75);border-color:rgba(255,255,255,.32);}
  .arrow svg{width:19px;height:19px;}
  .arrow.prev{left:14px;}
  .arrow.next{right:14px;}
  @media (max-width:640px){
    .arrow{width:36px;height:36px;}
    .arrow.prev{left:8px;}
    .arrow.next{right:8px;}
  }
  @media (max-width:640px){
    .stage{padding:12px;}
  }

  .dots{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;gap:9px;
    padding:9px 12px;
    border-radius:99px;
    background:rgba(20,17,13,.45);
    backdrop-filter:blur(6px);
    z-index:4;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:rgba(244,238,224,.35);
    border:none;padding:0;cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .dot.active{background:var(--spark);transform:scale(1.25);}

  @media (prefers-reduced-motion: reduce){
    .slide{transition:none;}
  }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="#top">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.781 9.35725L23.7157 8.8734L19.7701 7.94806L21.8082 4.90962L21.5673 4.58021L18.3891 6.14249L18.7401 1.89305L18.3891 1.71809L16.4163 5.12968L14.0939 0H13.6558L14.2245 5.02033L8.41633 0.374509L7.91293 0.50709L12.3837 6.14249L3.50748 3.17102L3.09116 3.63301L11.0245 8.14625L0.110204 9.07159L0 9.73176L11.3537 10.9646L1.86395 18.7596L2.30204 19.3542L13.5456 13.1885L11.332 24H12.0109L16.351 13.8281L18.9809 21.7762L19.4408 21.4235L18.4544 13.4536L22.4653 18.0106L22.7075 17.5486L19.7265 11.9118L23.9565 13.4099L24 12.9465L20.4721 10.1063L23.781 9.35725Z"/></svg>
    <span>Яндекс.Музыка - управление плеером</span>
  </a>
  <a class="btn-install" href="https://chromewebstore.google.com/detail/%D1%8F%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%BC%D1%83%D0%B7%D1%8B%D0%BA%D0%B0-%D1%83%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5-%D0%BF/jjdohkcaobjbohkkhakfddoifngielhk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v14m0 0-5-5m5 5 5-5M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Установить
  </a>
</header>

<main id="top" class="stage">
  <div class="frame">
    <div class="slides" id="slides">
      <figure class="slide active"><img src="assets/screenshots/screenshot-1-music.png" alt="Окно расширения при обычном воспроизведении: обложка, перемотка, лайк, громкость" width="1280" height="800"></figure>
      <figure class="slide"><img src="assets/screenshots/screenshot-2-radio.png" alt="Окно расширения в режиме радио с блоком «Сейчас в эфире»" width="1280" height="800"></figure>
      <figure class="slide"><img src="assets/screenshots/screenshot-3-options.png" alt="Страница настроек: горячие клавиши, уведомления, ИИ-музыка" width="1280" height="800"></figure>
      <figure class="slide"><img src="assets/screenshots/screenshot-4-ai.png" alt="Метка ИИ-музыки у трека и у артиста" width="1280" height="800"></figure>
      <figure class="slide"><img src="assets/screenshots/screenshot-5-obs.png" alt="Файл с текущим треком и обложкой для OBS" width="1280" height="800"></figure>
      <figure class="slide"><img src="assets/screenshots/screenshot-6-lastfm.png" alt="Подключение аккаунта Last.fm и очередь отправки" width="1280" height="800"></figure>
    </div>

    <button class="arrow prev" type="button" aria-label="Предыдущий слайд">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="arrow next" type="button" aria-label="Следующий слайд">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="dots" role="tablist" aria-label="Слайды">
      <button class="dot active" type="button" aria-label="Слайд 1"></button>
      <button class="dot" type="button" aria-label="Слайд 2"></button>
      <button class="dot" type="button" aria-label="Слайд 3"></button>
      <button class="dot" type="button" aria-label="Слайд 4"></button>
      <button class="dot" type="button" aria-label="Слайд 5"></button>
      <button class="dot" type="button" aria-label="Слайд 6"></button>
    </div>
  </div>
</main>

<script>
(function(){
  var stage = document.querySelector('.stage');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));
  var prevBtn = document.querySelector('.arrow.prev');
  var nextBtn = document.querySelector('.arrow.next');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var i = 0, timer = null;

  function show(n){
    i = (n + slides.length) % slides.length;
    slides.forEach(function(s, idx){ s.classList.toggle('active', idx === i); });
    dots.forEach(function(d, idx){ d.classList.toggle('active', idx === i); });
  }
  function next(){ show(i + 1); }
  function prev(){ show(i - 1); }

  function play(){
    if (reduceMotion) return;
    stop();
    timer = setInterval(next, 6000);
  }
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }

  prevBtn.addEventListener('click', function(){ prev(); play(); });
  nextBtn.addEventListener('click', function(){ next(); play(); });
  dots.forEach(function(d, idx){
    d.addEventListener('click', function(){ show(idx); play(); });
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ next(); play(); }
    if (e.key === 'ArrowLeft'){ prev(); play(); }
  });

  stage.addEventListener('mouseenter', stop);
  stage.addEventListener('mouseleave', play);

  var touchX = null;
  stage.addEventListener('touchstart', function(e){ touchX = e.changedTouches[0].clientX; stop(); }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
    touchX = null;
    play();
  }, {passive:true});

  play();
})();
</script>
</body>
</html>
