<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Яндекс.Музыка — управление плеером</title>
<meta name="description" content="Расширение Chrome для управления плеером Яндекс Музыки с панели браузера: обложка, перемотка, лайк, громкость, горячие клавиши, метка ИИ-музыки и скробблинг в Last.fm.">
<link rel="icon" type="image/png" href="assets/icon-128.png">
<meta property="og:title" content="Яндекс.Музыка — управление плеером">
<meta property="og:description" content="Плеер Яндекс Музыки на панели браузера: обложка, перемотка, лайк, громкость, горячие клавиши, метка ИИ-музыки и скробблинг в Last.fm.">
<meta property="og:image" content="assets/screenshots/screenshot-1-music.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ee;
    --ink:#211c14;
    --muted:#6b6151;
    --line:#ddd3ba;
    --spark:#c98600;
    --spark-ink:#141210;
    --spark-glow:rgba(201,134,0,.22);
    --stage:#0c0a08;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --paper:#141210;
      --ink:#f4eee0;
      --muted:#a89d88;
      --line:#332c22;
      --spark:#f5df00;
      --spark-ink:#1a1710;
      --spark-glow:rgba(245,223,0,.2);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#141210;
    --ink:#f4eee0;
    --muted:#a89d88;
    --line:#332c22;
    --spark:#f5df00;
    --spark-ink:#1a1710;
    --spark-glow:rgba(245,223,0,.2);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',system-ui,'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}

  /* ---------- header ---------- */
  header.site{
    flex:none;
    min-height:60px;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    padding:10px 22px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:1 1 auto;}
  .brand svg{width:22px;height:22px;color:var(--spark);flex:none;}
  .brand span{
    font-family:'Unbounded','Manrope',system-ui,sans-serif;
    font-weight:700;font-size:15px;letter-spacing:.005em;
    line-height:1.25;
  }
  .btn-install{
    flex:none;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--spark);color:var(--spark-ink);
    padding:10px 18px;border-radius:99px;
    font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;
    text-decoration:none;
    box-shadow:0 8px 22px -10px var(--spark-glow);
  }
  .btn-install svg{width:16px;height:16px;}
  @media (max-width:440px){
    header.site{padding:8px 12px;gap:10px;}
    .brand svg{width:18px;height:18px;}
    .brand span{font-size:12.5px;}
    .btn-install{padding:8px 13px;font-size:12.5px;gap:6px;}
    .btn-install svg{width:14px;height:14px;}
  }

  .brand small{display:inline;font:inherit;}

  /* ---------- stage / carousel ---------- */
  .stage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    overflow:hidden;
    touch-action:pan-y;
  }
  .frame{
    position:relative;
    width:100%;height:100%;
    max-width:1280px;
    max-height:800px;
    border-radius:18px;
    overflow:hidden;
    background:var(--stage);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.45);
  }
  .slides{
    position:relative;
    width:100%;height:100%;
  }
  .slide{
    position:absolute;inset:0;
    margin:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity .55s ease;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto;}
  .visual,.shot{width:100%;height:100%;}
  .mobile-only{display:none;}
  .slide img{
    width:100%;height:100%;
    object-fit:contain;
  }

  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(20,17,13,.5);
    backdrop-filter:blur(6px);
    color:#f4eee0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
    z-index:4;
  }
  .arrow:hover{background:rgba(20,17,13,.75);border-color:rgba(255,255,255,.32);}
  .arrow svg{width:19px;height:19px;}
  .arrow.prev{left:14px;}
  .arrow.next{right:14px;}
  @media (max-width:640px){
    .arrow{width:36px;height:36px;}
    .arrow.prev{left:8px;}
    .arrow.next{right:8px;}
  }
  @media (max-width:640px){
    .stage{padding:12px;}
  }

  .carousel-controls{position:absolute;inset:0;pointer-events:none;z-index:4;}
  .carousel-controls button{pointer-events:auto;}
  .dots{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;padding:0 8px;border-radius:99px;
    background:rgba(20,17,13,.65);backdrop-filter:blur(6px);
  }
  .dot{width:36px;height:44px;border:0;background:none;padding:0;cursor:pointer;}
  .dot::after{content:"";display:block;margin:auto;width:7px;height:7px;border-radius:99px;
    background:rgba(244,238,224,.4);transition:width .3s ease,background .3s ease;}
  .dot.active::after{background:var(--spark);width:20px;}
  .rotation{position:absolute;right:14px;bottom:14px;width:44px;height:44px;
    border:1px solid #ffffff30;border-radius:50%;background:#14110db3;color:#f4eee0;
    cursor:pointer;font-size:16px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;}
  .gallery{position:relative;width:100%;height:100%;max-width:1280px;max-height:800px;}
  button,a{-webkit-tap-highlight-color:transparent;}
  button:focus-visible,a:focus-visible{outline:3px solid var(--spark);outline-offset:4px;}

  /* A portrait composition of the original screenshots, with real text above them. */
  @media (max-width:760px){
    html{height:auto;min-height:100%;}
    body{height:auto;min-height:100svh;overflow:auto;}
    header.site{min-height:76px;padding:16px 22px;gap:12px;border-bottom:0;background:transparent;}
    .brand{gap:9px;}
    .brand svg{width:28px;height:28px;}
    .brand span{font-size:11px;line-height:1.6;letter-spacing:-.025em;}
    .brand small{display:block;font-family:'Manrope',sans-serif;font-size:10px;
      font-weight:600;color:var(--muted);letter-spacing:.025em;}
    .brand-separator{display:none;}
    .btn-install{font-size:12px;padding:11px 14px;min-height:44px;gap:6px;box-shadow:none;}
    .btn-install svg{width:14px;height:14px;}
    .mobile-only{display:block;}
    .stage{display:block;flex:none;overflow:visible;padding:0 22px 30px;
      width:100%;max-width:540px;margin:0 auto;touch-action:pan-y;}
    .intro{position:relative;padding:25px 0 28px;}
    .eyebrow{display:flex;align-items:center;gap:8px;font-size:9px;font-weight:700;
      letter-spacing:.17em;text-transform:uppercase;margin:0 0 16px;color:var(--muted);}
    .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--spark);}
    h1{font-family:'Unbounded','Manrope',sans-serif;font-size:clamp(32px,8.8vw,47px);
      letter-spacing:-.065em;line-height:1.2;font-weight:700;margin:0;}
    h1 span{color:var(--muted);}
    .intro-copy{font-size:13px;line-height:1.65;max-width:290px;color:var(--muted);margin:16px 0 0;}
    .gallery{height:auto;max-height:none;}
    .frame{height:550px;max-height:none;overflow:visible;border-radius:26px;
      background:#121113;box-shadow:0 18px 32px -22px #0008;isolation:isolate;}
    .frame::before,.frame::after{content:"";position:absolute;inset:12px 6px -7px;
      border:1px solid var(--line);background:var(--paper);border-radius:26px;z-index:-1;transform:rotate(-2deg);}
    .frame::after{inset:20px 10px -13px;transform:rotate(2deg);z-index:-2;}
    .slides{border-radius:26px;overflow:hidden;background:#121113;}
    .slide{display:block;overflow:hidden;border-radius:26px;isolation:isolate;
      transition:opacity .45s ease,transform .6s cubic-bezier(.2,.7,.2,1);
      transform:translateX(22px) scale(.98);}
    .slide.active{transform:translateX(0) scale(1);}
    .slide::before{content:"";position:absolute;inset:24% -30% -22%;z-index:-1;
      background:radial-gradient(ellipse at center,var(--aura),transparent 65%);opacity:.65;
      transform:translateY(12px);transition:transform 1.2s ease;}
    .slide.active::before{transform:translateY(-12px);}
    .slide-copy{padding:25px 24px 0;color:#f6f2ea;}
    .feature-label{display:flex;align-items:center;justify-content:space-between;
      font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
      color:#c1b8ad;margin:0 0 15px;}
    .equalizer{display:flex;align-items:center;gap:3px;height:14px;}
    .equalizer b{display:block;width:2px;height:10px;border-radius:2px;background:#f5df00;
      animation:equalize 1.3s ease-in-out 3 alternate;}
    .equalizer b:nth-child(2){height:14px;animation-delay:-.7s;}
    .equalizer b:nth-child(3){height:6px;animation-delay:-.3s;}
    .equalizer b:nth-child(4){height:11px;animation-delay:-1s;}
    .slide-copy h2{font-size:25px;font-weight:700;letter-spacing:-.045em;line-height:1.2;margin:0 0 10px;}
    .slide-copy>p:last-child{font-size:12px;line-height:1.7;color:#bdb5c2;margin:0;max-width:330px;}
    .visual{position:absolute;left:0;right:0;bottom:25px;height:340px;
      display:flex;align-items:center;justify-content:center;perspective:900px;}
    .shot{position:relative;flex:none;width:min(84%,calc(340px * var(--crop-w) / 662));height:auto;
      aspect-ratio:var(--crop-w) / 662;overflow:hidden;border-radius:14px;
      box-shadow:0 26px 30px -15px #000b,0 0 0 1px #ffffff12;
      transform:translateY(20px) rotate(3deg) scale(.95);
      transition:transform .85s cubic-bezier(.16,1,.3,1);}
    .active .shot{transform:translateY(0) rotate(-2deg) scale(1);}
    .slide:nth-child(even).active .shot{transform:translateY(0) rotate(2deg) scale(1);}
    .shot img{position:absolute;max-width:none;width:calc(1280 / var(--crop-w) * 100%);
      height:auto;left:calc(-1 * var(--crop-x) / var(--crop-w) * 100%);top:calc(-70 / 662 * 100%);}
    .carousel-controls{position:relative;inset:auto;display:flex;align-items:center;
      justify-content:center;gap:4px;height:76px;margin-top:15px;}
    .dots{position:static;transform:none;display:flex;padding:0;background:none;backdrop-filter:none;}
    .dot{width:30px;}
    .dot::after{width:5px;height:5px;background:var(--line);}
    .dot.active::after{width:22px;background:var(--ink);}
    .arrow{position:static;transform:none;width:44px;height:44px;border:1px solid var(--line);
      background:transparent;color:var(--ink);backdrop-filter:none;}
    .arrow:hover{background:var(--line);border-color:var(--line);}
    .arrow svg{width:16px;height:16px;}
    .rotation{display:none;}
    .install-note{display:flex;gap:13px;align-items:center;border-top:1px solid var(--line);padding:21px 0 0;}
    .install-note svg{width:24px;height:24px;flex:none;color:var(--muted);}
    .install-note p{font-size:11px;line-height:1.7;color:var(--muted);margin:0;}
    .install-note strong{display:block;color:var(--ink);font-weight:700;}
  }
  @media (max-width:360px){
    header.site{padding:14px 16px;gap:8px;}
    .brand span{font-size:10px;}.brand svg{width:23px;height:23px;}
    .btn-install{padding:10px;font-size:11px;}.btn-install svg{display:none;}
    .stage{padding-right:16px;padding-left:16px;}
    .slide-copy{padding-right:20px;padding-left:20px;}
    .slide-copy h2{font-size:23px;}.dot{width:27px;}
  }
  @keyframes equalize{to{transform:scaleY(.4);}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="#top">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.781 9.35725L23.7157 8.8734L19.7701 7.94806L21.8082 4.90962L21.5673 4.58021L18.3891 6.14249L18.7401 1.89305L18.3891 1.71809L16.4163 5.12968L14.0939 0H13.6558L14.2245 5.02033L8.41633 0.374509L7.91293 0.50709L12.3837 6.14249L3.50748 3.17102L3.09116 3.63301L11.0245 8.14625L0.110204 9.07159L0 9.73176L11.3537 10.9646L1.86395 18.7596L2.30204 19.3542L13.5456 13.1885L11.332 24H12.0109L16.351 13.8281L18.9809 21.7762L19.4408 21.4235L18.4544 13.4536L22.4653 18.0106L22.7075 17.5486L19.7265 11.9118L23.9565 13.4099L24 12.9465L20.4721 10.1063L23.781 9.35725Z"/></svg>
    <span>Яндекс.Музыка<span class="brand-separator"> — </span><small>управление плеером</small></span>
  </a>
  <a class="btn-install" href="https://chromewebstore.google.com/detail/%D1%8F%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%BC%D1%83%D0%B7%D1%8B%D0%BA%D0%B0-%D1%83%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5-%D0%BF/jjdohkcaobjbohkkhakfddoifngielhk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v14m0 0-5-5m5 5 5-5M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Установить
  </a>
</header>

<main id="top" class="stage">
  <section class="intro mobile-only" aria-labelledby="mobile-title">
    <p class="eyebrow">Расширение для Chrome</p>
    <h1 id="mobile-title">Вся музыка.<br><span>Под рукой.</span></h1>
    <p class="intro-copy">Любимый плеер — на панели браузера.<br>Переключай треки, а не вкладки.</p>
  </section>
  <section class="gallery" aria-label="Возможности расширения" aria-roledescription="карусель" tabindex="0">
  <div class="frame">

    <div class="slides" id="slides">
      <figure class="slide active" style="--crop-x:753;--crop-w:448;--aura:#8061b8" role="group" aria-roledescription="слайд" aria-label="1 из 6: Плеер" aria-hidden="false">
        <figcaption class="slide-copy mobile-only">
          <p class="feature-label"><span>Плеер</span><span class="equalizer" aria-hidden="true"><b></b><b></b><b></b><b></b></span></p>
          <h2>Твой трек. В один клик.</h2><p>Обложка, перемотка, лайк и громкость.<br>Всё рядом, чем бы ты ни занимался.</p>
        </figcaption>
        <div class="visual"><div class="shot"><img src="assets/screenshots/screenshot-1-music.png" alt="Окно расширения при обычном воспроизведении: обложка, перемотка, лайк, громкость" width="1280" height="800"></div></div>
      </figure>
      <figure class="slide" style="--crop-x:810;--crop-w:391;--aura:#408c79" role="group" aria-roledescription="слайд" aria-label="2 из 6: Радио" aria-hidden="true">
        <figcaption class="slide-copy mobile-only">
          <p class="feature-label"><span>Радио</span><span class="equalizer" aria-hidden="true"><b></b><b></b><b></b><b></b></span></p>
          <h2>На своей волне.</h2><p>Станция и трек, который сейчас в эфире.<br>Плеер сам узнает, что ты слушаешь.</p>
        </figcaption>
        <div class="visual"><div class="shot"><img src="assets/screenshots/screenshot-2-radio.png" alt="Окно расширения в режиме радио с блоком «Сейчас в эфире»" width="1280" height="800"></div></div>
      </figure>
      <figure class="slide" style="--crop-x:498;--crop-w:703;--aura:#827657" role="group" aria-roledescription="слайд" aria-label="3 из 6: Настройки" aria-hidden="true">
        <figcaption class="slide-copy mobile-only">
          <p class="feature-label"><span>Настройки</span><span class="equalizer" aria-hidden="true"><b></b><b></b><b></b><b></b></span></p>
          <h2>Как нравится тебе.</h2><p>Горячие клавиши, уведомления и поведение плеера. Настрой свой ритм.</p>
        </figcaption>
        <div class="visual"><div class="shot"><img src="assets/screenshots/screenshot-3-options.png" alt="Страница настроек: горячие клавиши, уведомления, ИИ-музыка" width="1280" height="800"></div></div>
      </figure>
      <figure class="slide" style="--crop-x:753;--crop-w:448;--aura:#c76220" role="group" aria-roledescription="слайд" aria-label="4 из 6: ИИ-музыка" aria-hidden="true">
        <figcaption class="slide-copy mobile-only">
          <p class="feature-label"><span>ИИ-музыка</span><span class="equalizer" aria-hidden="true"><b></b><b></b><b></b><b></b></span></p>
          <h2>Знай, что слушаешь.</h2><p>Метка ИИ рядом с именем артиста.<br>Пропускай такие треки или оставляй играть.</p>
        </figcaption>
        <div class="visual"><div class="shot"><img src="assets/screenshots/screenshot-4-ai.png" alt="Метка ИИ-музыки у трека и у артиста" width="1280" height="800"></div></div>
      </figure>
      <figure class="slide" style="--crop-x:539;--crop-w:661;--aura:#3c6a9e" role="group" aria-roledescription="слайд" aria-label="5 из 6: Для стримов" aria-hidden="true">
        <figcaption class="slide-copy mobile-only">
          <p class="feature-label"><span>Для стримов</span><span class="equalizer" aria-hidden="true"><b></b><b></b><b></b><b></b></span></p>
          <h2>Музыка в кадре.</h2><p>Текущий трек и обложка — в файлы.<br>Подключи их к своему стриму в OBS.</p>
        </figcaption>
        <div class="visual"><div class="shot"><img src="assets/screenshots/screenshot-5-obs.png" alt="Файл с текущим треком и обложкой для OBS" width="1280" height="800"></div></div>
      </figure>
      <figure class="slide" style="--crop-x:518;--crop-w:683;--aura:#a03939" role="group" aria-roledescription="слайд" aria-label="6 из 6: Last.fm" aria-hidden="true">
        <figcaption class="slide-copy mobile-only">
          <p class="feature-label"><span>Last.fm</span><span class="equalizer" aria-hidden="true"><b></b><b></b><b></b><b></b></span></p>
          <h2>У каждого трека — след.</h2><p>Прослушанное отправится в Last.fm.<br>Твоя музыкальная история продолжается.</p>
        </figcaption>
        <div class="visual"><div class="shot"><img src="assets/screenshots/screenshot-6-lastfm.png" alt="Подключение аккаунта Last.fm и очередь отправки" width="1280" height="800"></div></div>
      </figure>
    </div>

  </div>
  <div class="carousel-controls">
    <button class="arrow prev" type="button" aria-label="Предыдущий слайд">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>


    <div class="dots" role="group" aria-label="Выбрать слайд">
      <button class="dot active" type="button" aria-label="Слайд 1"></button>
      <button class="dot" type="button" aria-label="Слайд 2"></button>
      <button class="dot" type="button" aria-label="Слайд 3"></button>
      <button class="dot" type="button" aria-label="Слайд 4"></button>
      <button class="dot" type="button" aria-label="Слайд 5"></button>
      <button class="dot" type="button" aria-label="Слайд 6"></button>
    </div>
    <button class="arrow next" type="button" aria-label="Следующий слайд">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="rotation" type="button" aria-label="Остановить слайд-шоу" aria-pressed="true"><span aria-hidden="true">Ⅱ</span></button>
  </div>
  <p class="sr-only" id="slide-status" aria-live="polite" aria-atomic="true"></p>
  </section>
  <footer class="install-note mobile-only">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
    <p><strong>Для Chrome на компьютере.</strong>Открой эту страницу на компьютере, чтобы установить расширение.</p>
  </footer>
</main>

<script>
(function(){
  var gallery = document.querySelector('.gallery');
  var slides = Array.from(document.querySelectorAll('.slide'));
  var dots = Array.from(document.querySelectorAll('.dot'));
  var rotation = document.querySelector('.rotation');
  var status = document.querySelector('#slide-status');
  var motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var mobile = window.matchMedia('(max-width:760px)');
  var index = 0, timer = null, touch = null, hovering = false, focusPaused = false;
  // Mobile slides are controlled only by swipes, arrows and pagination.
  var playing = !motion.matches && !mobile.matches;

  function show(next, announce){
    index = (next + slides.length) % slides.length;
    slides.forEach(function(slide, n){
      slide.classList.toggle('active', n === index);
      slide.setAttribute('aria-hidden', String(n !== index));
    });
    dots.forEach(function(dot, n){
      dot.classList.toggle('active', n === index);
      dot.setAttribute('aria-current', String(n === index));
    });
    if (announce) status.textContent = slides[index].getAttribute('aria-label');
  }
  function stopTimer(){clearInterval(timer);timer = null;}
  function syncPlayback(){
    stopTimer();
    if (mobile.matches) playing = false;
    rotation.setAttribute('aria-pressed', String(playing));
    rotation.setAttribute('aria-label', playing ? 'Остановить слайд-шоу' : 'Запустить слайд-шоу');
    rotation.firstElementChild.textContent = playing ? 'Ⅱ' : '▷';
    if (playing && !document.hidden && !hovering && !touch && !focusPaused) {
      timer = setInterval(function(){show(index + 1, false);}, 6000);
    }
  }
  function select(next){playing = false;show(next, true);syncPlayback();}
  document.querySelector('.prev').addEventListener('click', function(){select(index - 1);});
  document.querySelector('.next').addEventListener('click', function(){select(index + 1);});
  dots.forEach(function(dot, n){
    dot.setAttribute('aria-label', slides[n].getAttribute('aria-label'));
    dot.addEventListener('click', function(){select(n);});
  });
  rotation.addEventListener('click', function(){
    playing = !playing;
    // An explicit play request also works while this button has focus or hover.
    focusPaused = false;
    hovering = false;
    syncPlayback();
  });
  gallery.addEventListener('keydown', function(event){
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
      event.preventDefault();select(index + (event.key === 'ArrowRight' ? 1 : -1));
    }
  });
  gallery.addEventListener('pointerenter', function(event){
    if (event.pointerType === 'mouse') {hovering = true;syncPlayback();}
  });
  gallery.addEventListener('pointerleave', function(event){
    if (event.pointerType === 'mouse') {hovering = false;syncPlayback();}
  });
  gallery.addEventListener('focusin', function(){focusPaused = true;syncPlayback();});
  gallery.addEventListener('focusout', function(event){
    if (!gallery.contains(event.relatedTarget)) {focusPaused = false;syncPlayback();}
  });
  gallery.addEventListener('touchstart', function(event){
    if (event.touches.length !== 1) {touch = null;return;}
    touch = {x:event.touches[0].clientX, y:event.touches[0].clientY};stopTimer();
  }, {passive:true});
  gallery.addEventListener('touchend', function(event){
    if (!touch) return;
    var dx = event.changedTouches[0].clientX - touch.x;
    var dy = event.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) select(index + (dx < 0 ? 1 : -1));
    else syncPlayback();
  }, {passive:true});
  gallery.addEventListener('touchcancel', function(){touch = null;syncPlayback();}, {passive:true});
  document.addEventListener('visibilitychange', syncPlayback);
  motion.addEventListener('change', function(){if (motion.matches) playing = false;syncPlayback();});
  mobile.addEventListener('change', function(){if (mobile.matches) playing = false;syncPlayback();});
  show(0, false);
  syncPlayback();
})();
</script>
</body>
</html>
